<h1>Detalhes da venda</h1>

<h2>Venda #{{ venda.id }}</h2>

<p><strong>Cliente:</strong> {{ venda.cliente.nome }}</p>

<p><strong>Produto:</strong> {{ venda.produto.nome }}</p>

<p><strong>Quantidade:</strong> {{ venda.quantidade }}</p>

<p><strong>Valor total:</strong> R$ {{ venda.valor_total }}</p>

<p><strong>Data:</strong> {{ venda.data_venda|date:"d/m/Y H:i" }}</p>

<hr>

<a href="{% url 'vendas:excluir' venda.id %}"
   onclick="return confirm('Deseja excluir esta venda?');">
    Excluir venda
</a>

<br><br>

<a href="{% url 'vendas:vendas' %}">Voltar para lista</a>
