<h1>Editar produto</h1>
<form method="POST">
    {% csrf_token %}
    <p><label>Nome:</label>
        <input type="text" name="nome" value="{{ produto.nome }}">
    </p>
    
    <p><label>Descrição:</label>
        <input type="text" name="descricao" value="{{ produto.descricao }}">
    </p>
    
    <p><label>Preço: R$</label> 
        <input type="number" name="preco" step="0.01" min="0" value="{{ produto.preco|floatformat:2 }}">
    </p>
    
    <p><label>Quantidade em estoque:</label>
        <input type="number" name="quantidade" min="0" value="{{ produto.quantidade }}">
    </p>
    
    <button type="submit"> Salvar alterações </button>
    
    <a href="{% url 'produtos:detalhes' produto.id %}"> Cancelar </a>
</form>
